# Link the C runtime statically, so that the MSVC build runs without the Visual C++
# Redistributable installed (the GNU build has no such dependency).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
